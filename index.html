<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blush & Braid — Salon Demo</title>
<style>
:root{--plum:#392536;--plum2:#624454;--rose:#b9788e;--pink:#f4e5e9;--pale:#fffaf8;--cream:#f8f1eb;--ink:#332832;--muted:#82747d;--line:#eadde1;--green:#327454;--amber:#9b6b2f;--red:#a54851;--shadow:0 12px 35px #39253612}
*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:var(--plum);color:white;font-weight:650}button:hover{filter:brightness(1.08)}button.secondary{background:white;color:var(--plum);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--plum);border:1px solid transparent}button.danger{background:#fff0f0;color:var(--red);border:1px solid #f1d5d8}button.small{padding:7px 10px;font-size:12px;border-radius:9px}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--rose);box-shadow:0 0 0 3px #b9788e20}textarea{resize:vertical;min-height:90px}label{display:block;font-size:12px;font-weight:700;color:var(--plum2);margin:0 0 7px}.field{margin-bottom:14px}.muted{color:var(--muted)}.tiny{font-size:11px;color:var(--muted)}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:0 24px}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-family:Georgia,serif;letter-spacing:2px;font-size:21px;color:var(--plum);font-weight:bold}.brand small{display:block;font:9px system-ui;letter-spacing:3px;color:var(--rose);margin-top:3px}.nav{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.nav button{background:transparent;color:var(--plum2);padding:9px 12px;font-size:13px}.nav button.active{background:var(--pink);color:var(--plum)}.hero{background:linear-gradient(110deg,#f1dfe4,#f8ece8 58%,#ead5dc);border-radius:25px;min-height:390px;padding:55px;display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;overflow:hidden}.eyebrow{letter-spacing:3px;font-size:10px;font-weight:800;color:var(--rose)}h1,h2,h3,p{margin-top:0}h1{font:clamp(38px,5vw,62px)/1.05 Georgia,serif;color:var(--plum);margin:16px 0}h2{font:34px Georgia,serif;color:var(--plum);margin-bottom:10px}h3{font:21px Georgia,serif;color:var(--plum);margin-bottom:8px}.hero p{max-width:470px;line-height:1.7;color:#6f5b67}.hero-art{height:285px;border-radius:20px;background:linear-gradient(145deg,#d6aebc,#f4e6e9 50%,#9e7185);display:grid;place-items:center;position:relative}.hero-art:before{content:"";width:170px;height:220px;border-radius:48% 48% 42% 42%;background:linear-gradient(135deg,#352331,#775064 60%,#2c202c);box-shadow:25px 15px 0 #624454;transform:rotate(-8deg)}.hero-art:after{content:"BRAIDED BEAUTY";position:absolute;bottom:18px;right:20px;color:#fff;font:11px Georgia;letter-spacing:3px}.section{padding:55px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.section-head p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.service-card{display:flex;flex-direction:column;min-height:205px}.service-card .price{font:25px Georgia;color:var(--rose);margin:10px 0}.service-card p{font-size:13px;line-height:1.55;color:var(--muted);flex:1}.gallery-tile{height:235px;border-radius:17px;display:flex;align-items:end;padding:18px;color:white;font:22px Georgia;background:linear-gradient(155deg,#b47c92,#503849)}.gallery-tile:nth-child(2){background:linear-gradient(155deg,#c49b8b,#674b58)}.gallery-tile:nth-child(3){background:linear-gradient(155deg,#d2a8b5,#473442)}.gallery-tile:nth-child(4){background:linear-gradient(155deg,#a77b89,#302633)}.gallery-tile:nth-child(5){background:linear-gradient(155deg,#d9b9a7,#745263)}.gallery-tile:nth-child(6){background:linear-gradient(155deg,#bd91a0,#3e2b3b)}.cta{background:var(--plum);color:#fff;border-radius:22px;padding:34px;display:flex;justify-content:space-between;align-items:center;gap:20px}.cta h2{color:#fff}.cta p{color:#e3d2dc;margin:0}.footer{background:#30212e;color:#e9dce2;padding:35px 0;margin-top:55px}.footer .brand{color:white}.footer-grid{display:flex;justify-content:space-between;gap:25px;flex-wrap:wrap}.pill{display:inline-flex;padding:5px 9px;border-radius:30px;background:#f4e5e9;color:var(--plum2);font-size:11px;font-weight:700}.status{display:inline-block;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:750}.Pending{background:#fff2d9;color:#926323}.Confirmed{background:#e2f3e9;color:#286746}.Completed{background:#e8e8f7;color:#55558b}.Cancelled{background:#fde9e9;color:#a13d48}.Paid{background:#e2f3e9;color:#286746}.Unpaid{background:#fff2d9;color:#926323}
.notice{padding:12px 14px;border-radius:12px;background:#f4e5e9;color:var(--plum2);font-size:13px;margin:12px 0}.success{background:#e8f5ed;color:#286746}.error{background:#fff0f0;color:#a13d48}.layout{display:grid;grid-template-columns:225px 1fr;min-height:calc(100vh - 76px)}.sidebar{background:#352433;color:white;padding:25px 16px}.side-brand{font:20px Georgia;letter-spacing:2px;padding:0 10px 24px}.side-brand small{display:block;font:9px system-ui;letter-spacing:2px;color:#d5a9b9;margin-top:5px}.side-label{font-size:10px;letter-spacing:2px;color:#bda8b6;padding:15px 10px 7px}.side-btn{width:100%;display:flex;gap:11px;align-items:center;text-align:left;background:transparent;color:#e8dce4;padding:12px;border-radius:10px;margin:2px 0;font-size:13px}.side-btn.active,.side-btn:hover{background:#63495e;color:white}.admin-main{padding:30px;min-width:0}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:15px}.admin-top h2{margin:0;font-size:28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 25px}.stat{padding:19px;background:white;border:1px solid var(--line);border-radius:15px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font:30px Georgia;color:var(--plum);margin-top:9px}.table-wrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:14px 15px;border-bottom:1px solid #f0e7ea;font-size:13px}th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:#fffafb}tr:last-child td{border-bottom:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.admin-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}.toolbar>*{max-width:230px}.booking-item{padding:16px;border-bottom:1px solid var(--line)}.booking-item:last-child{border:0}.booking-item-top{display:flex;justify-content:space-between;gap:12px}.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f6e8eb,#fffaf8)}.login-card{width:min(440px,100%);background:white;padding:34px;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.login-card .brand{margin-bottom:28px}.modal-backdrop{position:fixed;inset:0;background:#20151dcc;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:white;border-radius:20px;padding:25px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.empty{padding:30px;text-align:center;color:var(--muted)}.hide-mobile{display:inline}.mobile-menu{display:none}
@media(max-width:800px){.wrap{padding:0 16px}.topbar{height:auto;min-height:70px;flex-wrap:wrap;padding:14px 0}.nav{width:100%;overflow:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}.hero{grid-template-columns:1fr;padding:30px;min-height:auto}.hero-art{height:190px}.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.sidebar{padding:12px;display:flex;gap:5px;overflow:auto;align-items:center}.side-brand,.side-label{display:none}.side-btn{width:auto;white-space:nowrap;margin:0;padding:10px}.admin-main{padding:20px 14px}.stats{grid-template-columns:repeat(2,1fr)}.admin-grid{grid-template-columns:1fr}.hide-mobile{display:none}.cta{align-items:flex-start;flex-direction:column}}
@media(max-width:480px){.grid{grid-template-columns:1fr}.gallery-tile{height:190px}.section{padding:38px 0}.two{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:25px}.admin-top{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<div id="app"></div><div id="modal-root"></div>
<script>
const KEY='blush_braid_demo_v1';
const initial={
 business:{name:'BLUSH & BRAID',phone:'08012345678',location:'Lagos, Nigeria',instagram:'@blushandbraid',deposit:10000,depositRequired:true},
 services:[
 {id:1,name:'Knotless Braids',price:25000,duration:'4–5 hours',description:'Lightweight, neat braids with a natural finish.',active:true},
 {id:2,name:'Cornrows',price:12000,duration:'2–3 hours',description:'Beautiful traditional and modern cornrow styles.',active:true},
 {id:3,name:'Goddess Braids',price:30000,duration:'5–6 hours',description:'Soft, flowing braids with elegant curly details.',active:true},
 {id:4,name:'Wig Installation',price:15000,duration:'1–2 hours',description:'A seamless, secure and polished installation.',active:true},
 {id:5,name:'Stitch Braids',price:18000,duration:'3–4 hours',description:'Defined stitch patterns with a clean finish.',active:true},
 {id:6,name:'Boho Braids',price:35000,duration:'5–7 hours',description:'Gorgeous braids with soft curly accents.',active:true}],
 bookings:[
 {id:'BB-1001',name:'Amara James',phone:'08030000001',service:'Knotless Braids',date:'2026-11-12',time:'10:00',note:'Medium size',status:'Pending',message:'',extra:0,payment:'Unpaid',created:Date.now()-80000},
 {id:'BB-1002',name:'Tomi Bello',phone:'08030000002',service:'Wig Installation',date:'2026-11-12',time:'12:00',note:'Bringing my own wig',status:'Confirmed',message:'Please arrive 10 minutes early.',extra:5000,payment:'Unpaid',created:Date.now()-60000},
 {id:'BB-1003',name:'Ada Okafor',phone:'08030000003',service:'Cornrows',date:'2026-11-13',time:'14:00',note:'Simple style',status:'Completed',message:'',extra:0,payment:'Paid',created:Date.now()-40000},
 {id:'BB-1004',name:'Zara Cole',phone:'08030000004',service:'Boho Braids',date:'2026-11-14',time:'10:00',note:'Long length',status:'Confirmed',message:'',extra:0,payment:'Paid',created:Date.now()-20000}],
 enquiries:[
 {id:1,name:'Mariam',phone:'08050000001',message:'Do you provide hair extensions?',status:'New',reply:''},
 {id:2,name:'Tolu',phone:'08050000002',message:'Can I reschedule my appointment?',status:'New',reply:''}],
 availability:{days:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],start:'09:00',end:'17:00',closedDates:[]}
};
let db=load();let page='home',adminPage='overview',isAdmin=false,filter='All',search='',calendarDate='2026-11-12',lookupPhone='',lookupRef='',toastMsg='',toastTimer;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x&&x.business?x:structuredClone(initial)}catch{return JSON.parse(JSON.stringify(initial))}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₦'+Number(n||0).toLocaleString('en-NG')}
function currentPrice(s){return Number(s?.discountPrice)>0 && Number(s.discountPrice)<Number(s.price) ? Number(s.discountPrice) : Number(s?.price||0)}
function dateFmt(d){if(!d)return '';return new Date(d+'T12:00:00').toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'})}
function timeFmt(t){if(!t)return '';let [h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}
function toast(m){toastMsg=m;let old=document.querySelector('.toast');if(old)old.remove();let n=document.createElement('div');n.className='toast';n.textContent=m;n.style='position:fixed;bottom:22px;right:22px;z-index:50;background:#392536;color:white;padding:14px 19px;border-radius:12px;box-shadow:0 8px 25px #0002;font-size:13px';document.body.appendChild(n);clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.remove(),3200)}
function activeServices(){return db.services.filter(s=>s.active)}
function status(s){return `<span class="status ${esc(s)}">${esc(s)}</span>`}
function clientNav(){return `<header class="wrap topbar"><div class="brand">${esc(db.business.name)}<small>BEAUTY · BRAIDS · CONFIDENCE</small></div><nav class="nav">${[['home','Home'],['services','Services'],['gallery','Gallery'],['booking','Book an appointment'],['mybooking','My booking'],['contact','Contact']].map(([id,t])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}</nav><button class="secondary small" onclick="go('adminlogin')">Admin login</button></header>`}
function serviceCard(s){
let discounted=currentPrice(s)<Number(s.price);
return `<article class="card service-card"><span class="pill">${discounted?'SPECIAL OFFER':esc(s.duration)}</span><h3 style="margin-top:15px">${esc(s.name)}</h3><p>${esc(s.description)}</p><div class="price">${discounted?`<span style="font-size:15px;color:#9b8d94;text-decoration:line-through;margin-right:8px">${money(s.price)}</span>`:''}${money(currentPrice(s))}</div>${discounted?`<div class="tiny" style="color:var(--green);margin-top:-7px;margin-bottom:10px">You save ${money(Number(s.price)-currentPrice(s))}</div>`:''}<button onclick="chooseService(${s.id})">Book this style</button></article>`
}
function clientHome(){return `${clientNav()}<main class="wrap"><section class="hero"><div><div class="eyebrow">YOUR HAIR, YOUR CROWN</div><h1>Where every braid tells a story.</h1><p>Thoughtful styling, beautiful details and a little time set aside just for you. Find your next look at Blush & Braid.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px"><button onclick="go('booking')">Book your appointment ↗</button><button class="secondary" onclick="go('services')">Explore services</button></div><p class="tiny" style="margin-top:20px">Lagos, Nigeria · By appointment</p></div><div class="hero-art"></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">THE BLUSH & BRAID EDIT</div><h2>Styles you'll love</h2><p>Our most-loved services, made with care.</p></div><button class="secondary" onclick="go('services')">View all services</button></div><div class="grid">${activeServices().slice(0,3).map(serviceCard).join('')}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">A LITTLE INSPIRATION</div><h2>Find your next look</h2></div></div>${galleryTiles()}</section><section class="cta"><div><h2>Your next hair day starts here.</h2><p>Choose your style and request an appointment in a few easy steps.</p></div><button style="background:#f4e5e9;color:#392536" onclick="go('booking')">Book now</button></section></main>${footer()}`}
function galleryTiles(){return `<div class="grid">${[['Knotless','Soft mauve'],['Boho','Warm rose'],['Stitch braids','Deep plum'],['Cornrows','Rosewood'],['Goddess','Nude blush'],['Wig install','Berry']].map(([name])=>`<div class="gallery-tile">${name}</div>`).join('')}</div><p class="tiny" style="margin-top:12px">Demo artwork uses stylised colour panels. Replace these with your own salon photos before launch.</p>`}
function footer(){return `<footer class="footer"><div class="wrap footer-grid"><div><div class="brand">${esc(db.business.name)}</div><p class="tiny" style="color:#d4c2cd;margin-top:12px">Beauty · Braids · Confidence</p></div><div><b>Visit or contact us</b><p class="tiny" style="color:#d4c2cd;margin:8px 0">${esc(db.business.location)}<br>${esc(db.business.phone)}<br>${esc(db.business.instagram)}</p></div><div class="tiny" style="color:#d4c2cd">© ${new Date().getFullYear()} Blush & Braid · Demo website</div></div></footer>`}
function clientPage(){if(page==='adminlogin')return loginPage();if(page==='home')return clientHome();let head=clientNav();if(page==='services')return `${head}<main class="wrap section"><div class="eyebrow">OUR MENU</div><h2>Services & pricing</h2><p class="muted">Select a service to request your preferred appointment.</p><div class="grid">${activeServices().map(serviceCard).join('')}</div></main>${footer()}`;
if(page==='gallery')return `${head}<main class="wrap section"><div class="eyebrow">STYLE INSPIRATION</div><h2>The gallery</h2><p class="muted">A little inspiration for your next appointment.</p>${galleryTiles()}</main>${footer()}`;
if(page==='booking')return `${head}<main class="wrap section" style="max-width:760px"><div class="eyebrow">RESERVE YOUR MOMENT</div><h2>Request an appointment</h2><p class="muted">Choose your service and preferred slot. Your request is pending until the salon confirms it.</p><form class="card" onsubmit="submitBooking(event)"><div class="two"><div class="field"><label>Full name</label><input name="name" required placeholder="Your full name"></div><div class="field"><label>Phone number</label><input name="phone" required placeholder="080..."></div></div><div class="field"><label>Service</label><select name="service" id="book-service" required>${activeServices().map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="two"><div class="field"><label>Preferred date</label><input name="date" type="date" min="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Preferred time</label><select name="time">${['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00'].map(t=>`<option value="${t}">${timeFmt(t)}</option>`).join('')}</select></div></div><div class="field"><label>Style details / notes</label><textarea name="note" placeholder="Length, size, colour or anything we should know..."></textarea></div><div class="notice">Estimated price: <b id="book-price">${money(activeServices()[0]?.price)}</b>. No payment is taken at this demo stage.</div><button type="submit">Submit appointment request</button></form></main>${footer()}`;
if(page==='mybooking')return `${head}<main class="wrap section" style="max-width:760px"><div class="eyebrow">YOUR APPOINTMENT</div><h2>Check your booking</h2><p class="muted">Enter the phone number you used and your booking reference.</p><form class="card" onsubmit="lookupBooking(event)"><div class="field"><label>Phone number</label><input name="phone" required value="${esc(lookupPhone)}"></div><div class="field"><label>Booking reference</label><input name="ref" required value="${esc(lookupRef)}" placeholder="e.g. BB-1005"></div><button>Find my booking</button></form><div id="lookup-result"></div></main>${footer()}`;
if(page==='contact')return `${head}<main class="wrap section" style="max-width:760px"><div class="eyebrow">WE'RE HERE TO HELP</div><h2>Let's talk hair.</h2><div class="grid" style="grid-template-columns:1fr 1fr;margin:20px 0"><div class="card"><h3>Visit us</h3><p class="muted">${esc(db.business.location)}</p></div><div class="card"><h3>Call or message</h3><p class="muted">${esc(db.business.phone)}<br>${esc(db.business.instagram)}</p></div></div><form class="card" onsubmit="sendEnquiry(event)"><h3>Send an enquiry</h3><div class="field"><label>Your name</label><input name="name" required></div><div class="field"><label>Phone number</label><input name="phone" required></div><div class="field"><label>Your message</label><textarea name="message" required placeholder="How can we help?"></textarea></div><button>Send message</button></form></main>${footer()}`}
function chooseService(id){go('booking');setTimeout(()=>{let s=db.services.find(x=>x.id===id);let el=document.querySelector('#book-service');if(s&&el){el.value=s.name;updateBookPrice()}},0)}
function updateBookPrice(){let s=db.services.find(x=>x.name===document.querySelector('#book-service')?.value);let el=document.querySelector('#book-price');if(el)el.textContent=money(currentPrice(s))}
function go(p){page=p;render();window.scrollTo(0,0)}
function submitBooking(e){e.preventDefault();let f=new FormData(e.target),service=f.get('service'),date=f.get('date'),time=f.get('time');if(db.bookings.some(b=>b.date===date&&b.time===time&&b.status!=='Cancelled')){toast('That time is already requested. Please choose another slot.');return}let id='BB-'+(1000+Math.max(0,...db.bookings.map(b=>Number(String(b.id).split('-')[1])||0))-1000+1);let b={id,name:f.get('name').trim(),phone:f.get('phone').trim(),service,date,time,note:f.get('note'),status:'Pending',message:'',extra:0,payment:'Unpaid',created:Date.now()};db.bookings.push(b);save();lookupPhone=b.phone;lookupRef=b.id;page='confirmation';render();window.scrollTo(0,0)}
function confirmation(){let b=db.bookings.find(x=>x.id===lookupRef);return `${clientNav()}<main class="wrap section" style="max-width:720px"><div class="card" style="text-align:center;padding:40px"><div style="font-size:42px">✧</div><div class="eyebrow">REQUEST RECEIVED</div><h2>Thank you, ${esc(b?.name||'there')}.</h2><p class="muted">Your appointment request has been sent to Blush & Braid. We'll review it and update its status.</p><div class="notice"><b>Booking reference: ${esc(b?.id)}</b><br>${esc(b?.service)} · ${dateFmt(b?.date)} · ${timeFmt(b?.time)}<br>Current status: ${status(b?.status||'Pending')}</div><button onclick="go('mybooking')">View my booking</button> <button class="secondary" onclick="go('home')">Back to home</button></div></main>${footer()}`}
function lookupBooking(e){e.preventDefault();let f=new FormData(e.target);lookupPhone=f.get('phone').trim();lookupRef=f.get('ref').trim().toUpperCase();render();let b=db.bookings.find(x=>x.id.toUpperCase()===lookupRef&&x.phone===lookupPhone);let root=document.querySelector('#lookup-result');if(!b){root.innerHTML='<div class="notice error">We could not find a booking with those details. Check your reference and phone number.</div>';return}root.innerHTML=bookingClientCard(b)}
function bookingClientCard(b){let service=db.services.find(s=>s.name===b.service);return `<div class="card" style="margin-top:18px"><div style="display:flex;justify-content:space-between;gap:10px"><h3>${esc(b.service)}</h3>${status(b.status)}</div><p class="muted">${dateFmt(b.date)} · ${timeFmt(b.time)}</p><p class="tiny">Reference ${esc(b.id)}</p>${b.message?`<div class="notice"><b>Message from the salon</b><br>${esc(b.message)}</div>`:''}${b.extra>0?`<div class="notice"><b>Additional charge: ${money(b.extra)}</b><br>Total estimated amount: ${money((service?.price||0)+b.extra)}<br>${b.payment==='Paid'?'<b>Payment marked as received.</b>':'Payment is awaiting action.'}</div>`:''}<p class="tiny">For changes to your appointment, contact ${esc(db.business.phone)}. Demo payments are not processed.</p></div>`}
function sendEnquiry(e){e.preventDefault();let f=new FormData(e.target);db.enquiries.unshift({id:Date.now(),name:f.get('name'),phone:f.get('phone'),message:f.get('message'),status:'New',reply:''});save();e.target.reset();toast('Your enquiry has been sent. Thank you!')}
function loginPage(){return `<div class="login-screen"><form class="login-card" onsubmit="login(event)"><div class="brand">${esc(db.business.name)}<small>PRIVATE ADMIN WORKSPACE</small></div><h2 style="font-size:30px">Welcome back.</h2><p class="muted">Sign in to manage your salon.</p><div class="field"><label>Email address</label><input name="email" type="email" value="admin@blushandbraid.demo" required></div><div class="field"><label>Password</label><input name="password" type="password" value="blush123" required></div><div id="login-error"></div><button style="width:100%">Sign in</button><div class="notice" style="margin-top:18px">Demo access<br><b>admin@blushandbraid.demo</b><br><b>blush123</b></div><button type="button" class="secondary" style="width:100%" onclick="go('home')">← Back to client website</button></form></div>`}
function login(e){e.preventDefault();let f=new FormData(e.target);if(f.get('email')==='admin@blushandbraid.demo'&&f.get('password')==='blush123'){isAdmin=true;adminPage='overview';render()}else document.querySelector('#login-error').innerHTML='<div class="notice error">Incorrect demo email or password.</div>'}
const menu=[['overview','▦','Overview'],['calendar','▦','Calendar'],['bookings','▤','Bookings'],['services','✂','Services'],['clients','♙','Clients'],['enquiries','✉','Enquiries'],['settings','⚙','Settings']];
function adminShell(content,title){return `<div class="layout"><aside class="sidebar"><div class="side-brand">${esc(db.business.name)}<small>ADMIN WORKSPACE</small></div><div class="side-label">WORKSPACE</div>${menu.map(([id,ic,n])=>`<button class="side-btn ${adminPage===id?'active':''}" onclick="adminGo('${id}')"><span>${ic}</span>${n}${id==='enquiries'&&db.enquiries.filter(e=>e.status==='New').length?`<span style="margin-left:auto;background:#b9788e;border-radius:20px;padding:2px 7px;font-size:10px">${db.enquiries.filter(e=>e.status==='New').length}</span>`:''}</button>`).join('')}<div style="margin-top:35px"><button class="side-btn" onclick="isAdmin=false;go('home')">↗ View client website</button><button class="side-btn" onclick="isAdmin=false;go('home')">⇥ Log out</button></div></aside><main class="admin-main"><div class="admin-top"><div><div class="eyebrow">BLUSH & BRAID / ADMIN</div><h2>${title}</h2></div><div><span class="pill">● Demo account</span></div></div>${content}<p class="tiny" style="margin-top:28px">Demo workspace · Changes save in this browser only</p></main></div>`}
function adminGo(p){adminPage=p;render()}
function overview(){let pending=db.bookings.filter(b=>b.status==='Pending').length,confirmed=db.bookings.filter(b=>b.status==='Confirmed').length,clients=new Set(db.bookings.map(b=>b.phone)).size,revenue=db.bookings.filter(b=>b.status==='Completed').reduce((a,b)=>a+(db.services.find(s=>s.name===b.service)?.price||0)+b.extra,0);return `<div class="stats"><div class="stat"><span>Total bookings</span><strong>${db.bookings.length}</strong></div><div class="stat"><span>Pending requests</span><strong>${pending}</strong></div><div class="stat"><span>Confirmed</span><strong>${confirmed}</strong></div><div class="stat"><span>Clients</span><strong>${clients}</strong></div></div><div class="admin-grid"><section class="card"><div class="section-head"><div><h3>Recent appointments</h3><p>Latest booking activity</p></div><button class="secondary small" onclick="adminGo('bookings')">View all</button></div>${db.bookings.slice().sort((a,b)=>b.created-a.created).slice(0,5).map(b=>`<div class="booking-item"><div class="booking-item-top"><b>${esc(b.name)}</b>${status(b.status)}</div><div class="tiny">${esc(b.service)} · ${dateFmt(b.date)} · ${timeFmt(b.time)}</div></div>`).join('')||'<div class="empty">No bookings yet.</div>'}</section><section class="card"><h3>Business snapshot</h3><p class="muted">Completed service value</p><h2>${money(revenue)}</h2><p class="tiny">Demo estimate only — not payment reconciliation.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><p class="muted">New enquiries</p><h2>${db.enquiries.filter(e=>e.status==='New').length}</h2><button class="secondary" onclick="adminGo('enquiries')">Review enquiries</button></section></div>`}
function bookingsPage(){let rows=db.bookings.filter(b=>(filter==='All'||b.status===filter)&&(`${b.name} ${b.phone} ${b.id}`).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.created-a.created);return `<div class="toolbar"><input placeholder="Search client, phone or reference" value="${esc(search)}" oninput="search=this.value;render()" style="flex:1"><select onchange="filter=this.value;render()">${['All','Pending','Confirmed','Completed','Cancelled'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><button onclick="newBookingModal()">+ Add booking</button></div><div class="table-wrap"><table><thead><tr><th>Client</th><th>Service</th><th>Date & time</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(b=>`<tr><td><b>${esc(b.name)}</b><div class="tiny">${esc(b.phone)} · ${esc(b.id)}</div></td><td>${esc(b.service)}</td><td>${dateFmt(b.date)}<div class="tiny">${timeFmt(b.time)}</div></td><td>${status(b.status)}</td><td><div class="actions"><button class="small secondary" onclick="bookingModal('${b.id}')">Details</button>${b.status==='Pending'?`<button class="small" onclick="setStatus('${b.id}','Confirmed')">Confirm</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No bookings match your search.</td></tr>'}</tbody></table></div>`}
function calendarPage(){let rows=db.bookings.filter(b=>b.date===calendarDate&&b.status!=='Cancelled').sort((a,b)=>a.time.localeCompare(b.time));return `<div class="card" style="max-width:550px"><div class="field"><label>Select a date</label><input type="date" value="${calendarDate}" onchange="calendarDate=this.value;render()"></div><h3>Schedule · ${dateFmt(calendarDate)}</h3>${rows.map(b=>`<div class="booking-item"><div class="booking-item-top"><b>${timeFmt(b.time)} · ${esc(b.name)}</b>${status(b.status)}</div><div class="tiny">${esc(b.service)} · ${esc(b.phone)}</div><button class="secondary small" style="margin-top:8px" onclick="bookingModal('${b.id}')">View booking</button></div>`).join('')||'<div class="empty">No appointments on this date.</div>'}</div>`}
function servicesPage(){
return `<div class="section-head"><div><div class="eyebrow">MENU & PRICING CONTROL</div><h3>Manage your services</h3><p>Changes saved here appear on the public client website and booking form.</p></div><button onclick="serviceModal()">＋ Add new service</button></div>
<div class="notice"><b>Discount pricing:</b> Edit any service and enter a sale price to show a discounted price to clients. Leave the sale price blank to use the regular price.</div>
<div class="grid">${db.services.map(s=>{let discounted=currentPrice(s)<Number(s.price);return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(s.name)}</h3><span class="pill">${s.active?'Published':'Hidden'}</span></div><p class="muted">${esc(s.description)}</p><div style="margin:12px 0">${discounted?`<div class="tiny" style="text-decoration:line-through">${money(s.price)} regular price</div><h3 style="color:var(--green);margin:4px 0">${money(currentPrice(s))} <span class="tiny">sale price</span></h3><span class="pill">Save ${money(Number(s.price)-currentPrice(s))}</span>`:`<h3 style="color:var(--rose)">${money(s.price)}</h3><div class="tiny">Regular price · No discount</div>`}</div><div class="tiny">${esc(s.duration)}</div><div class="actions" style="margin-top:15px"><button class="secondary small" onclick="serviceModal(${s.id})">Edit service / price</button><button class="small ${s.active?'danger':'secondary'}" onclick="toggleService(${s.id})">${s.active?'Hide':'Publish'}</button></div></div>`}).join('')}</div>`
}
function clientsPage(){let clients=[...new Map(db.bookings.map(b=>[b.phone,b])).values()].filter(b=>(b.name+' '+b.phone).toLowerCase().includes(search.toLowerCase()));return `<div class="toolbar"><input placeholder="Search clients..." value="${esc(search)}" oninput="search=this.value;render()"></div><div class="table-wrap"><table><thead><tr><th>Client</th><th>Phone</th><th>Appointments</th><th>Last service</th></tr></thead><tbody>${clients.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${db.bookings.filter(b=>b.phone===c.phone).length}</td><td>${esc(c.service)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No clients found.</td></tr>'}</tbody></table></div>`}
function enquiriesPage(){return `<div class="admin-grid"><section class="card"><h3>Customer messages</h3>${db.enquiries.map(e=>`<div class="booking-item"><div class="booking-item-top"><b>${esc(e.name)}</b>${status(e.status==='New'?'Pending':'Completed')}</div><div class="tiny">${esc(e.phone)}</div><p style="margin:10px 0">${esc(e.message)}</p>${e.reply?`<div class="notice">Your reply: ${esc(e.reply)}</div>`:''}<div class="actions"><button class="secondary small" onclick="replyEnquiry(${e.id})">Reply / mark read</button><button class="danger small" onclick="deleteEnquiry(${e.id})">Archive</button></div></div>`).join('')||'<div class="empty">No enquiries.</div>'}</section><section class="card"><h3>How enquiries work</h3><p class="muted">Client messages appear here. In a production version, replies can be sent by email or WhatsApp. In this demo, replies are stored and shown in the admin record.</p></section></div>`}
function settingsPage(){return `<form class="card" style="max-width:700px" onsubmit="saveSettings(event)"><h3>Business profile</h3><div class="field"><label>Business name</label><input name="name" value="${esc(db.business.name)}" required></div><div class="two"><div class="field"><label>Phone</label><input name="phone" value="${esc(db.business.phone)}"></div><div class="field"><label>Instagram</label><input name="instagram" value="${esc(db.business.instagram)}"></div></div><div class="field"><label>Location</label><input name="location" value="${esc(db.business.location)}"></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Deposit settings</h3><label>Default deposit amount (₦)</label><input name="deposit" type="number" min="0" value="${db.business.deposit}"><label style="display:flex;gap:9px;align-items:center;margin-top:14px"><input name="required" type="checkbox" style="width:auto" ${db.business.depositRequired?'checked':''}> Require a deposit for bookings (demo setting)</label><p class="tiny">No actual deposit is collected in this demo.</p><button style="margin-top:18px">Save settings</button><button type="button" class="secondary" style="margin-left:8px" onclick="resetDemo()">Reset demo data</button></form>`}
function render(){let app=document.querySelector('#app');if(page==='confirmation'&&!isAdmin){app.innerHTML=confirmation();return}if(isAdmin){let title=menu.find(x=>x[0]===adminPage)?.[2]||'Overview';let content=({overview,bookings:bookingsPage,calendar:calendarPage,services:servicesPage,clients:clientsPage,enquiries:enquiriesPage,settings:settingsPage}[adminPage]||overview)();app.innerHTML=adminShell(content,title);return}if(page==='adminlogin'){app.innerHTML=loginPage();return}app.innerHTML=clientPage();if(page==='booking'){document.querySelector('#book-service')?.addEventListener('change',updateBookPrice)}}
function setStatus(id,s){let b=db.bookings.find(x=>x.id===id);if(b){b.status=s;save();render();toast('Booking updated.')}}
function bookingModal(id){let b=db.bookings.find(x=>x.id===id);if(!b)return;let s=db.services.find(x=>x.name===b.service);document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>Booking details</h3><button class="ghost" onclick="closeModal()">✕</button></div><p><b>${esc(b.name)}</b> · ${esc(b.phone)}<br><span class="tiny">${esc(b.id)}</span></p><div class="notice">${esc(b.service)} · ${dateFmt(b.date)} · ${timeFmt(b.time)}<br>${status(b.status)}</div><div class="field"><label>Message to client</label><textarea id="admin-message">${esc(b.message)}</textarea></div><div class="field"><label>Additional charge (₦)</label><input id="admin-extra" type="number" min="0" value="${b.extra||0}"></div><div class="field"><label>Payment status (demo only)</label><select id="admin-payment"><option ${b.payment==='Unpaid'?'selected':''}>Unpaid</option><option ${b.payment==='Paid'?'selected':''}>Paid</option></select></div><div class="notice">Service price: ${money(currentPrice(s))} · Extra: ${money(b.extra)}<br><b>Estimated total: ${money(currentPrice(s)+b.extra)}</b></div><div class="actions"><button onclick="saveBookingDetails('${b.id}')">Save & notify in client portal</button><button class="secondary" onclick="closeModal()">Close</button></div><p class="tiny" style="margin-top:14px">Demo only: this does not send a real SMS, WhatsApp message, invoice or payment link.</p></div></div>`}
function saveBookingDetails(id){let b=db.bookings.find(x=>x.id===id);b.message=document.querySelector('#admin-message').value;b.extra=Number(document.querySelector('#admin-extra').value)||0;b.payment=document.querySelector('#admin-payment').value;save();closeModal();render();toast('Booking details saved. Client can view the update using My booking.')}
function closeModal(){document.querySelector('#modal-root').innerHTML=''}
function serviceModal(id){
let s=db.services.find(x=>x.id===id)||{name:'',price:'',discountPrice:'',duration:'',description:'',active:true};
document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="saveService(event,${id||0})"><div class="modal-head"><h3>${id?'Edit service':'Add new service'}</h3><button type="button" class="ghost" onclick="closeModal()">✕</button></div><p class="muted">Set the service details and choose whether it should be visible to clients.</p><div class="field"><label>Service name</label><input name="name" value="${esc(s.name)}" required></div><div class="two"><div class="field"><label>Regular price (₦)</label><input name="price" type="number" min="0" value="${s.price}" required></div><div class="field"><label>Discount / sale price (₦) — optional</label><input name="discountPrice" type="number" min="0" value="${s.discountPrice||''}" placeholder="Leave blank for no discount"></div></div><div class="notice">The regular price will appear crossed out on the client website whenever a valid lower sale price is entered.</div><div class="two"><div class="field"><label>Duration</label><input name="duration" value="${esc(s.duration)}" placeholder="e.g. 3–4 hours"></div><div class="field"><label>Visibility</label><select name="active"><option value="true" ${s.active?'selected':''}>Published — visible to clients</option><option value="false" ${!s.active?'selected':''}>Hidden — not visible to clients</option></select></div></div><div class="field"><label>Description</label><textarea name="description">${esc(s.description)}</textarea></div><div class="actions"><button>${id?'Save changes':'Add service'}</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form></div>`
}
function saveService(e,id){
e.preventDefault();
let f=new FormData(e.target),price=Number(f.get('price')),rawDiscount=String(f.get('discountPrice')||'').trim(),discountPrice=rawDiscount===''?null:Number(rawDiscount);
if(discountPrice!==null && (!Number.isFinite(discountPrice)||discountPrice<=0||discountPrice>=price)){toast('Sale price must be greater than zero and lower than the regular price.');return}
let s={name:f.get('name').trim(),price,discountPrice,duration:f.get('duration'),description:f.get('description'),active:f.get('active')==='true'};
if(id)Object.assign(db.services.find(x=>x.id===id),s);else db.services.push({...s,id:Math.max(0,...db.services.map(x=>x.id))+1});
save();closeModal();render();toast('Service and pricing saved. Client website updated.')
}
function toggleService(id){let s=db.services.find(x=>x.id===id);s.active=!s.active;save();render()}
function newBookingModal(){document.querySelector('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="adminCreateBooking(event)"><div class="modal-head"><h3>Create appointment</h3><button type="button" class="ghost" onclick="closeModal()">✕</button></div><div class="field"><label>Client name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Service</label><select name="service">${activeServices().map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="two"><div class="field"><label>Date</label><input name="date" type="date" required></div><div class="field"><label>Time</label><input name="time" type="time" required></div></div><button>Create booking</button></form></div>`}
function adminCreateBooking(e){e.preventDefault();let f=new FormData(e.target);let id='BB-'+(1001+db.bookings.length);db.bookings.push({id,name:f.get('name'),phone:f.get('phone'),service:f.get('service'),date:f.get('date'),time:f.get('time'),note:'Created by admin',status:'Confirmed',message:'',extra:0,payment:'Unpaid',created:Date.now()});save();closeModal();render();toast('Appointment created.')}
function replyEnquiry(id){let e=db.enquiries.find(x=>x.id===id);let reply=prompt('Write a reply for '+e.name+':',e.reply||'');if(reply===null)return;e.reply=reply;e.status='Read';save();render()}
function deleteEnquiry(id){db.enquiries=db.enquiries.filter(e=>e.id!==id);save();render()}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);db.business={...db.business,name:f.get('name'),phone:f.get('phone'),instagram:f.get('instagram'),location:f.get('location'),deposit:Number(f.get('deposit')),depositRequired:f.has('required')};save();render();toast('Business settings saved.')}
function resetDemo(){if(confirm('Reset all demo data to the original sample records?')){localStorage.removeItem(KEY);db=JSON.parse(JSON.stringify(initial));save();render();toast('Demo data reset.')}}
document.addEventListener('change',e=>{if(e.target.id==='book-service')updateBookPrice()});
render();
</script></body></html>
